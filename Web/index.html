<title>Smart Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column per view; the board is the hero, controls stack under it.
   Colors are game themes the player buys in the store, so the page commits to the active theme in both OS modes. */
:root {
  --bg1: #FFF4F8; --bg2: #FCE1EC; --bg3: #FCE1EC;
  --dark: #8A2A55; --accent: #E75A97; --soft: #F6C6DA; --muted: #A0607E;
  --deco: #F48FB1; --sel: #F9C5DA; --same: #FBD8E6; --rel: #FEF0F6; --hover: #FFF6FA; --press: #FBD6E5;
  --card: #FFFFFF; --wrong: #D93A4A;
  --font-display: "Varela Round", "Rubik", "Segoe UI", Arial, sans-serif;
  --font-body: "Rubik", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
html, body { min-height: 100%; }
body { background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3)); background-attachment: fixed; color: var(--dark); font-family: var(--font-body); font-size: 16px; }
#backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#backdrop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.decor { position: absolute; opacity: .28; user-select: none; }
.polaroid { position: absolute; background: #fff; padding: 8px 8px 22px; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); opacity: .9; }
.polaroid img { display: block; width: 170px; height: 170px; object-fit: cover; border-radius: 3px; }
@media (max-width: 900px) { .polaroid { display: none; } }
#app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; direction: rtl; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
.title { font-size: clamp(30px, 6vw, 44px); text-align: center; color: var(--dark); }
.sub { text-align: center; color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-bottom: 14px; }
.topbar .title { font-size: clamp(22px, 5vw, 32px); min-width: 0; }
.topbar > .row { justify-self: end; flex-wrap: nowrap; }
@media (max-width: 600px) {
  .topbar { grid-template-columns: auto 1fr; }
  .topbar .title { grid-column: 1 / -1; grid-row: 2; font-size: 24px; }
}
.btn { font: 500 17px var(--font-body); color: var(--dark); background: var(--card); border: 1.5px solid var(--soft); border-radius: 16px; padding: 11px 22px; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 16%, transparent); transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { background: var(--hover); border-color: var(--accent); }
.btn:active { background: var(--press); transform: translateY(2px); box-shadow: none; }
.btn:focus-visible, .cell:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.btn.big { font-size: 22px; padding: 15px 30px; border: 2.5px solid var(--accent); color: var(--accent); }
.btn.wide { width: 100%; }
.btn.on { background: var(--sel); border-color: var(--accent); }
.circle { width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 20px; display: inline-grid; place-items: center; }
.card { background: var(--card); border: 1.5px solid var(--soft); border-radius: 22px; padding: 22px; }
.coins { font: 500 20px var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.logo { width: 120px; height: 120px; margin: 0 auto; display: block; }
input[type=text] { font: 18px var(--font-body); width: 100%; box-sizing: border-box; padding: 11px 14px; border: 1.5px solid var(--soft); border-radius: 12px; background: #fff; color: var(--dark); }
label { font-weight: 500; }
.err { color: var(--wrong); font-size: 15px; min-height: 1em; }
.hearts span { display: inline-block; animation: bob 2.4s ease-in-out infinite; color: var(--deco); font-size: 30px; }
.hearts span:last-child { animation-delay: 1.2s; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.pop { animation: pop .5s cubic-bezier(.3,1.6,.6,1); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
/* Levels */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; max-width: 560px; margin: 0 auto; }
.lvl { aspect-ratio: 1 / 1.08; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; }
.lvl small { font-size: 12px; color: var(--muted); font-weight: 400; }
.lvl b { font: 400 clamp(22px, 5vw, 32px) var(--font-display); }
.lvl i { font-style: normal; font-size: 14px; letter-spacing: 1px; color: var(--accent); }
@media (max-width: 420px) { .levels { gap: 8px; } .lvl { border-radius: 16px; } }
/* Game */
.stats { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font: 500 18px var(--font-body); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
.stats .lives { color: var(--accent); letter-spacing: 2px; }
.board { direction: ltr; display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 470px); margin: 0 auto; background: #fff; border: 3px solid var(--accent); border-radius: 14px; overflow: hidden; position: relative; }
.cell { aspect-ratio: 1; border: 0; border-left: 1px solid var(--soft); border-top: 1px solid var(--soft); background: #fff; padding: 0; position: relative; font: 500 clamp(17px, 5.4vw, 27px) var(--font-body); color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.cell.c0 { border-left: 0; } .cell.r0 { border-top: 0; }
.cell.bl { border-left: 3px solid var(--accent); } .cell.bt { border-top: 3px solid var(--accent); }
.cell.given { color: var(--dark); font-weight: 700; }
.cell.wrong { color: var(--wrong); }
.cell.hint { font-weight: 700; }
.cell.rel { background: var(--rel); } .cell.same { background: var(--same); } .cell.sel { background: var(--sel); }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: clamp(8px, 1.9vw, 11px); color: var(--muted); line-height: 1; }
.notes span { display: grid; place-items: center; }
.status { text-align: center; color: var(--muted); min-height: 1.5em; margin: 10px 0; }
.pad { direction: ltr; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; width: min(100%, 520px); margin: 0 auto 10px; }
.pad .btn { padding: 10px 0; font-size: clamp(18px, 5vw, 26px); border-radius: 14px; }
.pad .btn.done { visibility: hidden; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tools .btn { font-size: 15px; padding: 9px 14px; }
/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg2) 78%, transparent); direction: rtl; }
.overlay.solid { background: linear-gradient(135deg, var(--bg1), var(--bg2)); }
.overlay .card { width: min(100%, 420px); text-align: center; display: flex; flex-direction: column; gap: 12px; }
.stars { font-size: 42px; color: var(--accent); letter-spacing: 4px; }
.breakdown { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; text-align: right; font-variant-numeric: tabular-nums; margin: 0 auto; }
.fall { position: fixed; top: -50px; z-index: 6; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(var(--spin)); } }
/* Store */
.shop-row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.shop-row .ico { font-size: 40px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { border: 1.5px solid var(--soft); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: center; background: var(--hover); }
.tile.selected { border: 2px solid var(--accent); background: var(--rel); }
.swatch { height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; overflow: hidden; border: 1px solid rgba(0,0,0,.06); }
.swatch img { width: 100%; height: 110px; object-fit: cover; }
.swatch.pic { height: 110px; }
.credit { font-size: 11px; color: var(--muted); line-height: 1.4; }
/* Help */
.help li { margin: 6px 0; line-height: 1.6; }
.help ul { padding-inline-start: 4px; list-style: none; margin: 6px 0 14px; }
.help li::before { content: "♥  "; color: var(--accent); }
.help h3 { color: var(--accent); font-size: 22px; }
.tip { background: var(--rel); border-radius: 14px; padding: 12px 16px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>

const THEMES = [

  T("winter", "חורף ❄️", 200, ["#EEF6FF", "#E3EEFF", "#F5F0FF"], null, ["#2B4C7E", "#5C9DE0", "#CADDF3", "#64809F", "#A6C8EE", "#D2E3F7", "#E1ECFA", "#F3F8FE", "#F8FBFF", "#DCE8F8"], ["❄️", "⛄", "🌨️", "🧣", "✨"]),
  T("peter", "פיטר הארנב 🐰", 250, ["#F4F8EE", "#FCEFE3", "#E9F1F8"], null, ["#4E5B3C", "#7FA05A", "#DCE6CC", "#7C8668", "#B9CF9E", "#DCEACB", "#E8F1DD", "#F5F9EF", "#FAFCF6", "#E2ECD4"], ["🥕", "🌿", "🐰"], ["peter1.jpg", "peter2.jpg", "peter3.jpg"], "איורים: Beatrix Potter, 1902 · נחלת הכלל"),
  T("alice", "אליס בארץ הפלאות 🎩", 250, ["#EEF3FF", "#FFF1E8", "#F3EAFF"], null, ["#2F3E6E", "#5470C8", "#CFD9F2", "#6C7799", "#9DB0E6", "#D3DCF5", "#E2E8F8", "#F3F6FD", "#F8FAFF", "#DCE3F6"], ["🎩", "🫖", "⏰", "🃏"], ["alice1.jpg", "alice2.jpg"], "איורים: John Tenniel, 1890 · נחלת הכלל"),

];
const SYMBOLS = [
  { id: "numbers", name: "מספרים", price: 0, s: ["1", "2", "3", "4", "5", "6", "7", "8", "9"] },
  { id: "fruits", name: "פירות", price: 80, s: ["🍓", "🍒", "🍑", "🍋", "🍏", "🍇", "🍉", "🥝", "🍊"] },
  { id: "animals", name: "חיות", price: 80, s: ["🐱", "🐶", "🐰", "🦊", "🐼", "🐨", "🐸", "🐷", "🐵"] },
  { id: "sweets", name: "ממתקים", price: 80, s: ["🍩", "🍪", "🧁", "🍭", "🍬", "🍫", "🍰", "🍦", "🎂"], theme: "candy" },

  { id: "fairytale-set", name: "אגדות", price: 0, s: ["👑", "🏰", "👠", "🎃", "🐭", "🪄", "💍", "🍎", "🐉"], theme: "fairytale" },
];
// Pictures come from the img/ folder, or from inside the file in the single-file version
const imgSrc = name => (window.EMBEDDED_IMAGES && window.EMBEDDED_IMAGES[name]) || "img/" + name;
const setForTheme = themeId => SYMBOLS.find(x => x.theme === themeId);
// A theme's symbol set counts as owned once the theme is
const owns = id => P.owned.includes(id) || SYMBOLS.some(x => x.id === id && x.theme && P.owned.includes(x.theme));
const MAX_LIVES = 5, FREE_HINTS = 3, HINT_PACK = 30, HEART_PRICE = 30, MULT = 2;

// ---------- Storage: this browser, plus the viewer's claude.ai account when available ----------
const KEY = "smartSudoku.v1";
const freshProgress = () => ({ coins: 100, bonusHints: 0, bonusLives: 0, theme: "pink", symbols: "numbers", sound: true, owned: ["pink", "numbers"], stars: {}, times: {}, unlocked: {} });
let save = { profiles: {}, last: null, updatedAt: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) save = JSON.parse(raw); } catch (e) {}
let player = null; // profile name, or "אורח"
let P = freshProgress();
let cloud = null, cloudTimer = 0;

function persist() {
  if (player) save.profiles[player] = P;

  const old = P.times[G.id] || 0, newBest = !old || G.secs < old;
  const lc = levelCoins(G.id), sc = stars * 5, spd = speedCoins(G.id, G.secs), total = (lc + sc + spd) * MULT;
  P.stars[G.id] = Math.max(P.stars[G.id] || 0, stars);
  if (newBest) P.times[G.id] = G.secs;
  const d = dOf(G.id); P.unlocked[d] = Math.max(unlockedIn(d), Math.min(PER, nOf(G.id) + 1));
  P.coins += total; persist(); play("win"); celebrate(); drawGame();
  const nx = nextLevel(G.id), endDiff = nOf(G.id) === PER, D = DIFFS[d];
  const text = !nx ? "סיימת את כל השלבים בכל הדרגות! איזו אלופה 💖" : endDiff ? `סיימת את כל דרגת ${D.name}! ${D.emoji} 🎉` : `פתרת את שלב ${nOf(G.id)} 🎉`;
  overlay(`<div style="color:var(--deco);font-size:22px">✿ ♥ ✦ ♥ ✿</div><h2 class="title" style="font-size:44px">כל הכבוד!</h2>
    <div class="stars">${starsLine(stars)}</div><p class="sub" style="margin:0">${text}</p>
    <p style="margin:0;font-weight:500">⏱ ${fmt(G.secs)} ${newBest ? "· 🏆 שיא חדש!" : `· שיא: ${fmt(old)}`}</p>
    <div class="breakdown"><span>שלב</span><span>+${lc}</span><span>כוכבים</span><span>+${sc}</span><span>מהירות ⚡</span><span>+${spd}</span><span>בונוס כפול</span><span>×${MULT}</span><b>🪙 סה"כ</b><b>+${total}</b></div>
    ${nx ? `<button class="btn big wide" data-act="next">${endDiff ? `לדרגה הבאה: ${DIFFS[dOf(nx)].name} ▶` : "לשלב הבא ▶"}</button>` : ""}
    <button class="btn wide" data-act="tolevels">חזרה לשלבים</button>`);
}
function gameOver() {
  G.finished = true; stopTimer();
  overlay(`<div style="font-size:52px">💔</div><h2 class="title" style="font-size:34px">אוי, נגמרו הלבבות</h2><p class="sub" id="goMsg" style="margin:0">לא נורא! כל טעות היא חלק מהלמידה 💕</p>
    <button class="btn big wide" data-act="buyheart">❤ לב נוסף · ${HEART_PRICE} 🪙</button>
    <button class="btn wide" data-act="restart">לנסות שוב מההתחלה</button><button class="btn wide" data-act="tolevels">חזרה לשלבים</button>`);
}
function overlay(html, solid = false) { $("#layer").innerHTML = `<div class="overlay ${solid ? "solid" : ""}" role="dialog" aria-modal="true"><div class="card pop">${html}</div></div>`; }
function celebrate() {
  const shapes = ["♥", "✿", "✦", "❀", "💖", "🌸"], cols = ["var(--accent)", "var(--deco)", "var(--soft)"];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement("span"); el.className = "fall"; el.textContent = shapes[i % shapes.length];
    el.style.cssText = `left:${Math.random() * 100}vw;font-size:${16 + Math.random() * 20}px;color:${cols[i % 3]};--spin:${Math.random() * 720 - 360}deg;animation-duration:${2.5 + Math.random() * 2}s;animation-delay:${Math.random() * 1.2}s`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 6000);
  }
}

// ---------- Store ----------
let storeMsg = "";
function storeView() {
  const tile = (item, kind, preview, extra = "", lockedText = null) => {
    const owned = owns(item.id), selected = (kind === "theme" ? P.theme : P.symbols) === item.id;
    const locked = !owned && lockedText;
    return `<div class="tile ${selected ? "selected" : ""}">${preview}<b>${item.name}</b>${extra}
      <button class="btn" data-act="buy" data-kind="${kind}" data-id="${item.id}" ${selected || locked ? "disabled" : ""}>${selected ? "✓ בשימוש" : owned ? "לבחירה" : locked ? lockedText : item.price + " 🪙"}</button></div>`;
  };
  const themeName = id => (THEMES.find(t => t.id === id) || {}).name;
  return `${topBar("חנות 🛍️")}
  <p class="sub">מרוויחים מטבעות על כל שלב — וכמה שיותר כוכבים, יותר מטבעות!</p>
  <p class="sub" style="color:var(--dark);font-weight:500;min-height:1.5em" role="status">${storeMsg}</p>
  <div class="stack">
    <div class="card shop-row"><span class="ico">💡</span><div><h3>חבילת 3 רמזים</h3><span class="credit" style="font-size:14px">אחרי 3 הרמזים החינמיים בכל שלב. יש לך: ${P.bonusHints}</span></div><button class="btn" data-act="buyhints">${HINT_PACK} 🪙</button></div>
    <div class="card shop-row"><span class="ico">💖</span><div><h3>לב נוסף</h3><span class="credit" style="font-size:14px">נכנס לפעולה לבד כשנגמרים הלבבות. יש לך: ${P.bonusLives}</span></div><button class="btn" data-act="buylife">${HEART_PRICE} 🪙</button></div>
    <div class="card stack"><h3>🎨 ערכות נושא</h3><div class="tiles">${THEMES.map(t => tile(t, "theme",
      t.pics ? `<div class="swatch pic"><img src="${imgSrc(t.pics[0])}" alt=""></div>` : `<div class="swatch" style="background:linear-gradient(135deg,${t.bg.join(",")})">${t.decor ? t.decor.slice(0, 3).join(" ") : `<span><span style="color:${t.c[1]}">●</span> <span style="color:${t.c[0]}">●</span></span>`}</div>`,
      (setForTheme(t.id) ? `<span class="credit">כולל סמלים בלוח: ${setForTheme(t.id).s.slice(0, 3).join(" ")}</span>` : "") + (t.credit ? `<span class="credit">${t.credit}</span>` : ""))).join("")}</div></div>
    <div class="card stack"><h3>🍓 סמלים בלוח</h3><div class="tiles">${SYMBOLS.map(s => tile(s, "symbols", `<div class="swatch" style="background:var(--rel);font-weight:700;direction:ltr">${s.s.slice(0, 3).join(" ")}</div>`,
      s.theme ? `<span class="credit">מתאים לערכה ${themeName(s.theme)}</span>` : "", s.price === 0 && s.theme ? `מגיע עם ${themeName(s.theme)}` : null)).join("")}</div></div>
  </div>`;
}
function spend(price) { if (P.coins < price) { storeMsg = "אין מספיק מטבעות 😅 — אפשר להרוויח עוד בשלבים"; return false; } P.coins -= price; play("coin"); return true; }

// ---------- Help ----------
function helpView() {
  return `${topBar("איך משחקים?")}<div class="card help">
  <h3>מהו סודוקו?</h3><ul><li>חידת היגיון עם לוח של 9×9 משבצות, שמחולק ל-9 ריבועים של 3×3.</li><li>חלק מהמשבצות כבר מלאות, והמטרה היא למלא את כל השאר.</li><li>לא צריך לחשב כלום — רק לחשוב בהיגיון.</li></ul>
  <h3>החוקים</h3><ul><li>בכל <b>שורה</b> יופיעו המספרים 1 עד 9, כל אחד פעם אחת.</li><li>בכל <b>עמודה</b> — אותו דבר.</li><li>בכל <b>ריבוע 3×3</b> — אותו דבר.</li></ul>
  <h3>איך משחקים כאן</h3><ul><li>לוחצים על משבצת ריקה ואז על מספר. במקלדת אפשר להקליד 1–9, למחוק עם Backspace ולזוז עם החצים.</li><li>מספר שגוי מופיע <span style="color:var(--wrong);font-weight:500">באדום</span> ומוריד לב. יש 5 לבבות.</li><li><b>פתקים ✏️</b> כותבים אפשרויות קטנות, <b>רמז 💡</b> ממלא משבצת נכונה, <b>ביטול ↩</b> מחזיר צעד.</li><li><b>משחק חוזר</b> מנקה את אותו לוח, <b>שנה את דף הסודוקו</b> נותן לוח אחר באותו שלב.</li><li>יש 4 דרגות קושי, ובכל אחת 20 שלבים.</li></ul>
  <h3>כוכבים ומטבעות</h3><ul><li>בלי טעויות ובלי רמזים = 3 כוכבים ⭐⭐⭐</li><li>כל שלב נותן מטבעות, יותר בדרגות גבוהות, ועוד בונוס מהירות ⚡ — הכל כפול ×2.</li><li>בחנות קונים רמזים, לבבות, ערכות נושא וסמלים.</li></ul>
  <p class="tip"><b>💡 טיפ:</b> התחילו משורות, עמודות וריבועים שכמעט מלאים — שם הכי קל לגלות מה חסר.</p>
  <p class="credit">איורי הדמויות בערכות פיטר הארנב, אליס ואגדות קלאסיות הם בנחלת הכלל (Wikimedia Commons).</p></div>`;
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "back") { if (view === "game") stopTimer(); return back(); }
  if (a === "login") { const n = $("#name").value.trim(); if (n.length < 2) { $("#nameErr").textContent = "השם צריך להיות לפחות 2 תווים"; return; } return login(n); }
  if (a === "guest") return login("אורח");
  if (a === "pick") return login(b.dataset.name);
  if (a === "logout") { player = null; P = freshProgress(); applyTheme(); navStack = []; return go("menu", false); }
  if (a === "levels") return go("levels");
  if (a === "store") { storeMsg = ""; return go("store"); }
  if (a === "help") { if (view === "game") stopTimer(); return go("help"); }
  if (a === "diff") { diff = +b.dataset.d; return render(); }
  if (a === "play") { newGame(+b.dataset.id); return go("game"); }
  if (a === "cell") { if (!G.finished) { G.sel = [+b.dataset.r, +b.dataset.c]; drawGame(); $(`[data-r="${G.sel[0]}"][data-c="${G.sel[1]}"]`)?.focus(); } return; }
  if (a === "num") return place(+b.dataset.n);
  if (a === "undo") { if (!G.finished && G.hist.length) { [G.board, G.notes, G.hinted] = JSON.parse(G.hist.pop()); G.status = "ביטלנו את הצעד האחרון ↩"; drawGame(); } return; }
  if (a === "erase") { if (G.finished || !G.sel) return; const [r, c] = G.sel; if (G.puz[r][c] || (!G.board[r][c] && !G.notes[r][c])) return; pushHist(); G.board[r][c] = 0; G.notes[r][c] = 0; G.hinted[r][c] = false; return drawGame(); }
  if (a === "notes") { G.notesMode = !G.notesMode; G.status = G.notesMode ? "מצב פתקים: המספרים ייכתבו קטן, בתור אפשרויות ✏️" : "בחרו משבצת ריקה ואז מספר"; return drawGame(); }
  if (a === "hint") return hint();
  if (a === "restart") { startBoard(); drawGame(); return startTimer(); }
  if (a === "newboard") { newGame(G.id); drawGame(); return startTimer(); }
  if (a === "next") { const nx = nextLevel(G.id); newGame(nx); return render(); }
  if (a === "tolevels") { $("#layer").innerHTML = ""; return back(); }
  if (a === "pause") { if (G.finished) return; G.paused = true; stopTimer(); return overlay(`<div style="font-size:52px;color:var(--accent)">⏸</div><h2 class="title" style="font-size:34px">המשחק בהפסקה</h2><p class="sub" style="margin:0">הזמן נעצר על ⏱ ${fmt(G.secs)}</p><button class="btn big wide" data-act="resume">המשך לשחק ▶</button><button class="btn wide" data-act="tolevels">חזרה לשלבים</button>`, true); }
  if (a === "resume") { G.paused = false; $("#layer").innerHTML = ""; return startTimer(); }
  if (a === "sound") { P.sound = !P.sound; persist(); return drawGame(); }
  if (a === "buyheart") { if (P.coins < HEART_PRICE) { $("#goMsg").textContent = `אין מספיק מטבעות 😅 (צריך ${HEART_PRICE} 🪙)`; return; } P.coins -= HEART_PRICE; play("coin"); persist(); G.lives = 1; G.finished = false; G.status = "קיבלת לב נוסף! ממשיכים 💖"; $("#layer").innerHTML = ""; drawGame(); return startTimer(); }
  if (a === "buyhints") { if (spend(HINT_PACK)) { P.bonusHints += 3; storeMsg = "קנית 3 רמזים! 💡"; persist(); } return render(); }
  if (a === "buylife") { if (spend(HEART_PRICE)) { P.bonusLives++; storeMsg = "קנית לב נוסף! 💖"; persist(); } return render(); }
  if (a === "buy") {
    const kind = b.dataset.kind, list = kind === "theme" ? THEMES : SYMBOLS, item = list.find(x => x.id === b.dataset.id);
    if (!owns(item.id)) { if (!spend(item.price)) return render(); P.owned.push(item.id); storeMsg = `קנית את "${item.name}"! 🎉`; }
    if (kind === "theme") {
      P.theme = item.id; applyTheme();
      const match = setForTheme(item.id); if (match && owns(match.id)) P.symbols = match.id;
    } else P.symbols = item.id;
    persist(); return render();
  }
});
document.addEventListener("keydown", e => {
  if (view === "menu" && e.key === "Enter" && e.target.id === "name") return $('[data-act="login"]').click();
  if (view !== "game" || !G || G.finished || G.paused || $("#layer").innerHTML) return;
  if (/^[1-9]$/.test(e.key)) { if (!G.sel) G.sel = [0, 0]; place(+e.key); }
  else if (e.key === "Backspace" || e.key === "Delete") $('[data-act="erase"]').click();
  else if (e.key.toLowerCase() === "n") $('[data-act="notes"]').click();
  else if (e.key.startsWith("Arrow")) {
    e.preventDefault(); const [r, c] = G.sel || [0, 0];
    const m = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    G.sel = [(r + m[0] + 9) % 9, (c + m[1] + 9) % 9]; drawGame();
  }
});
document.addEventListener("visibilitychange", () => { if (view !== "game" || !G) return; if (document.hidden) stopTimer(); else if (!G.finished && !G.paused) startTimer(); });

// ---------- Start ----------
if (save.last && save.profiles[save.last]) { player = save.last; P = save.profiles[player]; }
applyTheme(); render(); connectCloud().then(() => { if (view === "menu") render(); });
</script>
