<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פיצוח הצופן · Mind Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/hub.css">
<script src="../shared/hub.js"></script>
<style>
/* One row per guess: number, the gems, and the clue pegs. The current row is raised. */
.cb { max-width: 470px; margin: 0 auto; display: flex; flex-direction: column; gap: 5px; }
.guess { direction: ltr; display: grid; grid-template-columns: 26px 1fr 44px; align-items: center; gap: 10px; padding: 5px 12px; border-radius: 999px; border: 1px solid transparent; }
.guess.past { background: color-mix(in srgb, var(--card) 70%, transparent); border-color: var(--line); }
.guess.cur { background: var(--card); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
.guess.future { opacity: .45; }
.guess .no { font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.slots { display: flex; gap: 8px; justify-content: center; }
.slot { width: var(--gs); height: var(--gs); border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--muted) 45%, transparent); background: none; padding: 0; display: grid; place-items: center; flex: none; }
.guess.cur .slot { cursor: pointer; }
.guess.cur .slot.sel { border: 2px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.slot.full { border-style: solid; border-color: transparent; }
.pegs { display: grid; grid-template-columns: repeat(3, 10px); gap: 4px; justify-content: center; }
.pegs.p4 { grid-template-columns: repeat(2, 10px); }
.peg { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 20%, transparent); }
.peg.exact { background: var(--accent); }
.peg.near { background: none; box-shadow: 0 0 0 1.8px var(--accent) inset; }
/* The gems themselves */
.gem { width: 86%; height: 86%; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0 9%, transparent 10%), radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--g) 65%, #fff), var(--g) 55%, color-mix(in srgb, var(--g) 70%, #000)); box-shadow: 0 3px 6px -2px color-mix(in srgb, var(--g) 70%, transparent); animation: drop .22s cubic-bezier(.3,1.6,.6,1); }
.emo { font-size: calc(var(--gs) * .66); line-height: 1; animation: drop .22s cubic-bezier(.3,1.6,.6,1); }
@keyframes drop { from { transform: scale(.4); opacity: 0; } }
.controls { position: sticky; bottom: 0; z-index: 3; margin: 14px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 0 auto 10px; max-width: 470px; --gs: 40px; }
.palette button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; padding: 0; position: relative; transition: transform .15s; }
.palette button:hover { transform: translateY(-2px); }
.palette kbd { position: absolute; bottom: -4px; left: -4px; font: 500 10px var(--body); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; color: var(--muted); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.secret { display: flex; gap: 8px; justify-content: center; padding: 10px; border-radius: 999px; background: color-mix(in srgb, var(--soft) 50%, var(--card)); --gs: 40px; direction: ltr; margin: 0 auto 14px; width: fit-content; }
.secret .slot { border-style: solid; border-color: var(--line); background: var(--card); color: var(--muted); font: 500 18px var(--display); }
.diffs { display: grid; gap: 12px; max-width: 520px; margin: 0 auto; }
.diff { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; text-align: right; border-radius: 22px; padding: 16px 20px; }
.diff h3 { font-size: 22px; }
.diff .small { margin-top: 2px; }
.diff .wins { color: var(--gold); font-size: 14px; }
.pv-row { display: flex; gap: 4px; --gs: 26px; direction: ltr; }
.pv-row > span { width: 26px; height: 26px; display: grid; place-items: center; }
.status { text-align: center; color: var(--muted); min-height: 1.6em; margin: 6px 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { $, esc } = Hub;

const JEWELS = ["#C2414B", "#3466B0", "#E0A030", "#3E9A6B", "#8B5BB5", "#E58BA6", "#2BA3A3", "#3A3A44"];
const CFG = {
  id: "codebreaker", title: "פיצוח הצופן", startCoins: 40, startStock: { reveal: 2 },
  items: [
    Hub.theme("plum", 0), Hub.theme("rose", 120), Hub.theme("ocean", 120), Hub.theme("sage", 120), Hub.theme("night", 220),
    { id: "set-jewels", slot: "set", name: "אבני חן", price: 0 },
    { id: "set-fruit", slot: "set", name: "פירות", price: 90, s: ["🍓", "🫐", "🍋", "🍏", "🍇", "🍑", "🥝", "🥥"] },
    { id: "set-space", slot: "set", name: "חלל", price: 110, s: ["🌍", "🌙", "⭐", "🪐", "☄️", "🚀", "🛸", "☀️"] },
    { id: "set-garden", slot: "set", name: "גן", price: 110, s: ["🌹", "🌼", "🌷", "🍀", "🌻", "🦋", "🐞", "🍄"] },
    { id: "set-sweets", slot: "set", name: "ממתקים", price: 130, s: ["🍰", "🍩", "🍪", "🧁", "🍭", "🍫", "🍦", "🍬"] },
    { id: "reveal2", consumable: true, stockId: "reveal", amount: 2, name: "2 גילויים", desc: "גילוי חושף אבן אחת בצופן", price: 35 },
    { id: "reveal6", consumable: true, stockId: "reveal", amount: 6, name: "6 גילויים", desc: "חבילה משתלמת", price: 90 },
  ],
  storeGroups: [{ slot: "theme", title: "ערכות צבע" }, { slot: "set", title: "אבני הצופן" }, { consumable: true, title: "עזרים" }],
  boards: [{ id: "wins", title: "צפנים שפוצחו", bots: [["קוואזר", "🛸", 40], ["אוריון", "👾", 18], ["ניצוץ", "🤖", 6]] }],
  duel: {
    mode: "race",
    start: r => { newGame([8, 18, 28][r.level], true); view = "game"; nav = ["menu"]; render(); },
    seconds: r => [80, 130, 170][r.level],
    progress: () => !G ? 0 : G.won ? 1 : Math.min(.9, Math.max(0, ...G.guesses.map(g => g.exact + g.near * .4)) / G.D.slots * .9),
    over: () => !!G && G.done && !G.won, lose: () => { G.done = true; render(); },
    active: () => view === "game", menu: () => { view = "menu"; nav = []; render(); },
  },
  preview: it => `<div class="pv-row">${[0, 1, 2, 3].map(i => `<span>${symbol(i, it)}</span>`).join("")}</div>`,
};
const DIFFS = [
  { name: "מתחילים", slots: 4, colors: 6, dup: false, tries: 10, coins: 15, note: "4 אבנים, 6 צבעים, בלי חזרות" },
  { name: "מתקדמים", slots: 4, colors: 6, dup: true, tries: 9, coins: 25, note: "4 אבנים, 6 צבעים, צבע יכול לחזור" },
  { name: "מומחים", slots: 5, colors: 7, dup: true, tries: 10, coins: 40, note: "5 אבנים, 7 צבעים, עם חזרות" },
  { name: "אגדה", slots: 5, colors: 8, dup: true, tries: 9, coins: 60, note: "5 אבנים, 8 צבעים, רק 9 ניסיונות" },
];
const NEED_WINS = 2;
// 30 levels: more stones, more colours, repeats, and fewer tries as you climb
const COUNT = 30;
function levelD(L) {
  const t = [[3, 5, false, 10], [4, 6, false, 10], [4, 6, true, 9], [4, 7, true, 9], [5, 7, true, 10], [5, 8, true, L >= 28 ? 8 : 9]][Math.min(5, Math.floor((L - 1) / 5))];
  return { name: `שלב ${L}`, slots: t[0], colors: t[1], dup: t[2], tries: t[3], coins: 10 + L * 2, note: "" };
}

let W, view = "menu", nav = [], G = null;
const P = () => { W.progress.wins = W.progress.wins || [0, 0, 0, 0]; W.progress.best = W.progress.best || [0, 0, 0, 0]; return W.progress; };
function symbol(i, set = Hub.equipped("set")) {
  return set.s ? `<span class="emo">${set.s[i]}</span>` : `<span class="gem" style="--g:${JEWELS[i]}"></span>`;
}

// ---------- Logic ----------
function newGame(L, duel = false) {
  const d = Math.min(2, Math.floor((L - 1) / 10));
  const D = levelD(L), pool = [...Array(D.colors).keys()];
  const secret = D.dup ? Array.from({ length: D.slots }, () => Math.floor(Math.random() * D.colors)) : Hub.shuffle(pool).slice(0, D.slots);
  G = { L, duel, d, D, secret, guesses: [], cur: Array(D.slots).fill(null), sel: 0, revealed: [], done: false, won: false };
}
function score(g) {
  let exact = 0; const a = {}, b = {};
  g.forEach((v, i) => { if (v === G.secret[i]) exact++; else { a[v] = (a[v] || 0) + 1; b[G.secret[i]] = (b[G.secret[i]] || 0) + 1; } });
  let near = 0; for (const k in a) near += Math.min(a[k], b[k] || 0);
  return { exact, near };
}

// ---------- Views ----------
function go(v) { nav.push(view); view = v; render(); scrollTo(0, 0); }
function back() { view = nav.pop() || "menu"; render(); }
function render() {
  Hub.closeOverlay();
  $("#app").innerHTML = ({ menu: menuView, levels: () => `${Hub.topbar("שלבים")}${Hub.levelMap({ count: COUNT, names: ["צפנים קטנים", "צבעים חוזרים", "צפנים של אגדה"] })}`, game: gameView, store: () => Hub.store(), help: helpView })[view]();
}
function menuView() {
  return Hub.menu({ tagline: "המחשב בחר צופן סודי של אבני חן. בכל ניסיון תקבלו רמז — כמה אבנים במקום הנכון, וכמה רק בצבע הנכון.", buttons: [["levels", "שלבים", true], ["store", "החנות"], ["help", "איך משחקים"]] });
}
function diffsView() {
  const p = P();
  return `${Hub.topbar("בחירת רמה")}<div class="diffs">${DIFFS.map((D, i) => {
    const open = i === 0 || p.wins[i - 1] >= NEED_WINS;
    return `<button class="btn diff" data-act="start" data-d="${i}" ${open ? "" : "disabled"}>
      <span><h3>${D.name}</h3><p class="small">${D.note} · ${D.tries} ניסיונות</p>
      <p class="wins">${open ? `ניצחונות: ${p.wins[i]}${p.best[i] ? ` · שיא: ${p.best[i]} ניסיונות` : ""}` : `🔒 נפתח אחרי ${NEED_WINS} ניצחונות ברמה הקודמת`}</p></span>
      <span class="chip">${Hub.coinSvg}${D.coins}+</span></button>`;
  }).join("")}</div>`;
}
function gameView() {
  const D = G.D, gs = D.slots === 4 ? 36 : 33;
  const rows = Array.from({ length: D.tries }, (_, i) => {
    const past = G.guesses[i], isCur = !G.done && i === G.guesses.length;
    const vals = past ? past.g : isCur ? G.cur : Array(D.slots).fill(null);
    const pegs = past ? [...Array(past.exact).fill("exact"), ...Array(past.near).fill("near"), ...Array(D.slots - past.exact - past.near).fill("")] : Array(D.slots).fill("");
    return `<div class="guess ${past ? "past" : isCur ? "cur" : "future"}" style="--gs:${gs}px">
      <span class="no">${i + 1}</span>
      <div class="slots">${vals.map((v, k) => isCur
        ? `<button class="slot ${v !== null ? "full" : ""} ${k === G.sel ? "sel" : ""}" data-act="slot" data-k="${k}" aria-label="מקום ${k + 1}">${v !== null ? symbol(v) : ""}</button>`
        : `<span class="slot ${v !== null ? "full" : ""}">${v !== null ? symbol(v) : ""}</span>`).join("")}</div>
      <div class="pegs ${D.slots === 4 ? "p4" : ""}" aria-label="${past ? `${past.exact} במקום, ${past.near} רק בצבע` : ""}">${pegs.map(c => `<i class="peg ${c}"></i>`).join("")}</div>
    </div>`;
  }).join("");
  const secret = `<div class="secret" aria-label="הצופן">${G.secret.map((v, i) => `<span class="slot">${G.done || G.revealed.includes(i) ? symbol(v) : "?"}</span>`).join("")}</div>`;
  return `${Hub.topbar(D.name)}
    ${secret}
    <div class="cb">${rows}</div>
    ${G.done ? "" : `<div class="controls"><div class="palette">${Array.from({ length: D.colors }, (_, i) => `<button data-act="color" data-c="${i}" aria-label="צבע ${i + 1}">${symbol(i)}<kbd>${i + 1}</kbd></button>`).join("")}</div>
    <div class="actions">
      <button class="btn primary" data-act="check" ${G.cur.includes(null) ? "disabled" : ""}>בדיקה ✓</button>
      <button class="btn" data-act="erase">⌫ מחיקה</button>
      <button class="btn" data-act="reveal">💡 גילוי · ${Hub.stock("reveal")}</button>
    </div>
    <p class="status" id="status">${G.msg || "● = אבן במקום הנכון · ○ = הצבע נכון אבל המקום לא"}</p></div>`}`;
}
function helpView() {
  return `${Hub.topbar("איך משחקים")}<div class="help card">
    <h2>המטרה</h2><p>לגלות את הצופן הסודי — סדר של אבני חן — בכמה שפחות ניסיונות.</p>
    <h2>הרמזים</h2><ul><li><b>● עיגול מלא</b> — אחת האבנים בצבע הנכון ובמקום הנכון.</li><li><b>○ עיגול ריק</b> — אחת האבנים בצבע שנמצא בצופן, אבל במקום אחר.</li>
    <li>הרמזים לא אומרים <b>איזו</b> אבן — רק כמה. זה כל הכיף.</li></ul>
    <h2>שליטה</h2><ul><li>לוחצים על צבע כדי להניח אותו במקום המסומן. לוחצים על מקום כדי לבחור אותו.</li><li>במקלדת: מספרים לצבעים, Backspace למחיקה, Enter לבדיקה.</li>
    <li><b>💡 גילוי</b> חושף אבן אחת מהצופן. אפשר לקנות עוד בחנות.</li></ul>
    <h2>שלבים ומטבעות</h2><ul><li>30 שלבים: עוד אבנים, עוד צבעים, צבעים שחוזרים ופחות ניסיונות. פיצוח פותח את השלב הבא.</li><li>כוכבים לפי מספר הניסיונות. כל ניסיון שנשאר מוסיף 2 מטבעות.</li></ul>
    <p class="small" style="margin-top:14px">💡 טיפ: בניסיון הראשון כדאי לשים כמה צבעים שונים — כך מגלים מהר אילו צבעים בכלל בצופן.</p></div>`;
}

// ---------- Playing ----------
const say = msg => { G.msg = msg; render(); };
function place(c) {
  if (G.done) return;
  G.cur[G.sel] = c; Hub.sound("tap");
  const next = G.cur.findIndex((v, i) => v === null && i > G.sel), first = G.cur.indexOf(null);
  G.sel = next >= 0 ? next : first >= 0 ? first : G.sel;
  render();
}
function check() {
  if (G.done || G.cur.includes(null)) return;
  const g = G.cur.slice(), s = score(g);
  G.guesses.push({ g, ...s });
  G.cur = Array(G.D.slots).fill(null); G.sel = 0;
  G.revealed.forEach(i => { G.cur[i] = G.secret[i]; });
  G.sel = Math.max(0, G.cur.indexOf(null));
  if (s.exact === G.D.slots) return finish(true);
  if (G.guesses.length >= G.D.tries) return finish(false);
  Hub.sound(s.exact || s.near ? "good" : "wrong");

  say(s.exact || s.near ? `${s.exact} במקום הנכון · ${s.near} רק בצבע הנכון` : "אף אחד מהצבעים האלה לא בצופן — גם זה מידע!");
}
function finish(won) {
  G.done = true; G.won = won; render();
  const p = P(), used = G.guesses.length, left = G.D.tries - used;
  if (!won) {
    Hub.sound("wrong");
    return G.duel ? Hub.result({ title: "הצופן ניצח הפעם", sub: "הצופן הסודי מופיע למעלה.", buttons: [["tomenu2", "לתפריט", true]] }) : Hub.levelResult({ L: G.L, count: COUNT, won: false, title: "הצופן ניצח הפעם", sub: "הצופן הסודי מופיע למעלה. בפעם הבאה!" });
  }
  const stars = used <= Math.ceil(G.D.tries * .45) ? 3 : used <= Math.ceil(G.D.tries * .7) ? 2 : 1;
  const first = !G.duel && Hub.levelDone(G.L, stars);
  const coins = (first || G.duel ? G.D.coins : Math.ceil(G.D.coins / 3)) + left * 2;
  p.wins[G.d]++; Hub.submitScore(p.wins.reduce((a, b) => a + b, 0), "wins"); if (!p.best[G.d] || used < p.best[G.d]) p.best[G.d] = used;
  Hub.save(); Hub.earn(coins); Hub.sound("win"); Hub.confetti();

  if (G.duel) Hub.result({ title: "פיצחת את הצופן!", sub: `ב-${used} ניסיונות`, stars, coins, buttons: [["tomenu2", "לתפריט", true]] });
  else Hub.levelResult({ L: G.L, count: COUNT, won: true, stars, coins, title: `פיצחת את הצופן! · שלב ${G.L}`, sub: `ב-${used} ניסיונות` });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "back") return back();
  if (a === "levels") return go("levels");
  if (a === "lvl") { newGame(+b.dataset.level); return go("game"); }
  if (a === "lvnext") { Hub.closeOverlay(); newGame(Math.min(COUNT, G.L + 1)); return render(); }
  if (a === "lvagain") { Hub.closeOverlay(); newGame(G.L); return render(); }
  if (a === "lvmap" || a === "todiffs") { Hub.closeOverlay(); view = "levels"; nav = ["menu"]; return render(); }
  if (a === "tomenu2") { Hub.closeOverlay(); view = "menu"; nav = []; return render(); }
  if (a === "store") { Hub.clearStoreMsg(); return go("store"); }
  if (a === "help") return go("help");
  if (a === "buy") { Hub.buy(b.dataset.item); return render(); }
  if (a === "slot") { const k = +b.dataset.k; if (G.sel === k && G.cur[k] !== null && !G.revealed.includes(k)) G.cur[k] = null; G.sel = k; return render(); }
  if (a === "color") return place(+b.dataset.c);
  if (a === "erase") {
    if (G.done) return;
    let k = G.cur[G.sel] !== null && !G.revealed.includes(G.sel) ? G.sel : G.cur.reduce((last, v, i) => v !== null && !G.revealed.includes(i) ? i : last, -1);
    if (k >= 0) { G.cur[k] = null; G.sel = k; }
    return render();
  }
  if (a === "check") return check();
  if (a === "reveal") {
    if (G.done) return;
    const hidden = G.secret.map((_, i) => i).filter(i => !G.revealed.includes(i));
    if (hidden.length <= 1) { return say("את האבן האחרונה תגלו לבד 😉"); }
    if (!Hub.useStock("reveal")) { Hub.sound("wrong"); return say("נגמרו הגילויים — אפשר לקנות עוד בחנות"); }
    const i = hidden[Math.floor(Math.random() * hidden.length)];
    G.revealed.push(i); G.cur[i] = G.secret[i]; Hub.sound("hint");
    if (G.sel === i) G.sel = Math.max(0, G.cur.indexOf(null));
    say(`גילית את האבן במקום ${i + 1}`);
    return;
  }
  if (a === "again") { Hub.closeOverlay(); newGame(G.L, G.duel); return render(); }
  if (a === "todiffs") { view = "diffs"; nav = ["menu"]; return render(); }
});
document.addEventListener("keydown", e => {
  if (view !== "game" || G.done || Hub.overlayOpen()) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= G.D.colors) place(n - 1);
  else if (e.key === "Backspace") $('[data-act="erase"]')?.click();
  else if (e.key === "Enter") { e.preventDefault(); check(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { G.sel = (G.sel + (e.key === "ArrowRight" ? 1 : -1) + G.D.slots) % G.D.slots; render(); }
});

Hub.start(CFG, (u, w) => { W = w; render(); });
</script>
</body>
</html>
