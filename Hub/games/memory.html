<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>זיכרון · Mind Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/hub.css">
<script src="../shared/hub.js"></script>
<style>
/* Cards turn over in 3D: the back (pattern from the store) and the face (a picture from the deck) */
.table { display: grid; gap: clamp(6px, 1.8vw, 12px); margin: 0 auto; direction: ltr; }
.mcard { aspect-ratio: 3 / 4; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mcard:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 14px; }
.mcard .in { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.3, 1.3, .5, 1); transform-style: preserve-3d; }
.mcard.up .in, .mcard.got .in { transform: rotateY(180deg); }
.mcard .face, .mcard .back { position: absolute; inset: 0; border-radius: clamp(10px, 2vw, 16px); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 8px 18px -12px color-mix(in srgb, var(--ink) 60%, transparent); }
.mcard .face { transform: rotateY(180deg); background: var(--card); border: 1px solid var(--line); font-size: var(--fs); }
.mcard.got .face { background: color-mix(in srgb, var(--soft) 55%, var(--card)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.mcard.got .face span { animation: got .5s ease-out; }
@keyframes got { 50% { transform: scale(1.25); } }
.mcard .back { background-color: var(--accent); border: 3px solid var(--card); }
.mcard .back::after { content: ""; position: absolute; inset: 8%; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.4); }
.mcard.miss .in { animation: shake .4s; }
@keyframes shake { 25% { transform: rotateY(180deg) translateX(-4px); } 75% { transform: rotateY(180deg) translateX(4px); } }
/* Card backs bought in the store */
.back-lines .back { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 6px, transparent 6px 14px); }
.back-dots .back { background-image: radial-gradient(rgba(255,255,255,.28) 2px, transparent 2.5px); background-size: 14px 14px; }
.back-check .back { background-image: conic-gradient(rgba(255,255,255,.18) 25%, transparent 0 50%, rgba(255,255,255,.18) 0 75%, transparent 0); background-size: 18px 18px; }
.back-waves .back { background-image: radial-gradient(circle at 50% 100%, transparent 6px, rgba(255,255,255,.22) 7px 8px, transparent 9px); background-size: 18px 10px; }
.back-gold .back { background: linear-gradient(135deg, #B8913A, #F2DC9B 35%, #C9A24C 55%, #F7E7B6 75%, #A8822E); border-color: #FFF8E6; }
.back-gold .back::after { border-color: rgba(120, 85, 20, .35); }
.pv-cards { display: flex; gap: 6px; direction: ltr; }
.pv-cards .mcard { width: 40px; cursor: default; --fs: 22px; }
.hud { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.tools { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.status { text-align: center; color: var(--muted); min-height: 1.6em; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { $, esc } = Hub;

const CFG = {
  id: "memory", title: "זיכרון", startCoins: 40, startStock: { peek: 2 },
  items: [
    Hub.theme("sage", 0), Hub.theme("rose", 110), Hub.theme("slate", 110), Hub.theme("amber", 120), Hub.theme("night", 200),
    { id: "deck-flowers", slot: "deck", name: "פרחים", price: 0, s: [..."🌸🌷🌻🌼🪷🌹🪻💐🍀🌿🍁🍄🌵🌾🪴🌺🌱🍂"] },
    { id: "deck-animals", slot: "deck", name: "חיות", price: 90, s: [..."🦊🐼🐨🐯🦁🐸🐵🐰🐻🐮🐷🐔🦉🦋🐢🦄🐙🦔"] },
    { id: "deck-ocean", slot: "deck", name: "מתחת לים", price: 100, s: [..."🐠🐟🐡🐬🐳🐋🦈🐙🦑🦀🦞🦐🐚🪸🐢🦭🐧🌊"] },
    { id: "deck-sweets", slot: "deck", name: "קונדיטוריה", price: 110, s: [..."🍰🧁🍩🍪🍫🍬🍭🍮🍯🍦🍨🍧🎂🥧🍡🍓🍒🥐"] },
    { id: "deck-space", slot: "deck", name: "חלל", price: 130, s: ["🌍", "🌙", "⭐", "🪐", "☄️", "🚀", "🛸", "☀️", "🌌", "🔭", "👽", "🌕", "🌑", "🌟", "💫", "🛰️", "🌠", "🌎"] },
    { id: "back-lines", slot: "back", name: "פסים", price: 0 },
    { id: "back-dots", slot: "back", name: "נקודות", price: 70 },
    { id: "back-check", slot: "back", name: "משבצות", price: 80 },
    { id: "back-waves", slot: "back", name: "גלים", price: 100 },
    { id: "back-gold", slot: "back", name: "רדיד זהב", price: 160 },
    { id: "peek2", consumable: true, stockId: "peek", amount: 2, name: "2 הצצות", desc: "הצצה הופכת את כל הקלפים לרגע", price: 35 },
    { id: "peek6", consumable: true, stockId: "peek", amount: 6, name: "6 הצצות", desc: "חבילה משתלמת", price: 90 },
  ],
  storeGroups: [{ slot: "theme", title: "ערכות צבע" }, { slot: "deck", title: "חפיסות קלפים" }, { slot: "back", title: "גב הקלפים" }, { consumable: true, title: "עזרים" }],
  boards: [{ id: "stars", title: "כוכבים", bots: [["קוואזר", "🛸", 42], ["אוריון", "👾", 22], ["ניצוץ", "🤖", 8]] }],
  duel: {
    mode: "race",
    start: r => { stopTimer(); newGame([3, 6, 11][r.level]); view = "game"; nav = ["menu"]; render(); },
    seconds: r => G.pairs * [5.5, 5, 4.6][r.level],
    progress: () => !G ? 0 : G.lost ? 0 : G.found / G.pairs,
    over: () => !!G?.lost, lose: () => { G.done = true; G.lost = true; stopTimer(); },
    active: () => view === "game", menu: () => { stopTimer(); view = "menu"; nav = []; render(); },
  },
  preview: it => it.slot === "deck"
    ? `<div class="pv-cards">${it.s.slice(0, 3).map(e => `<div class="mcard up"><div class="in"><div class="face"><span>${e}</span></div><div class="back"></div></div></div>`).join("")}</div>`
    : `<div class="pv-cards ${it.id}">${[0, 1, 2].map(() => `<div class="mcard"><div class="in"><div class="face"></div><div class="back"></div></div></div>`).join("")}</div>`,
};
const PAIRS = [4, 6, 6, 8, 8, 8, 10, 10, 12, 12, 12, 15, 15, 18, 18];
const colsFor = pairs => pairs <= 8 ? 4 : pairs <= 10 ? 5 : 6;

let W, view = "menu", nav = [], G = null, timerId = 0;
const P = () => { W.progress.stars = W.progress.stars || {}; return W.progress; };

// ---------- Logic ----------
function newGame(level) {
  const pairs = PAIRS[level - 1], pics = Hub.shuffle(Hub.equipped("deck").s.slice()).slice(0, pairs);
  G = { level, pairs, cards: Hub.shuffle([...pics, ...pics]).map(face => ({ face, got: false })), up: [], moves: 0, found: 0, secs: 0, busy: false, done: false, peeks: 0 };
}

// ---------- Views ----------
function go(v) { nav.push(view); view = v; render(); scrollTo(0, 0); }
function back() { stopTimer(); view = nav.pop() || "menu"; render(); }
function render() {
  Hub.closeOverlay();
  $("#app").innerHTML = ({ menu: menuView, levels: levelsView, game: gameView, store: () => Hub.store(), help: helpView })[view]();
}
function menuView() {
  return Hub.menu({ tagline: "הפכו שני קלפים בכל תור. זוג זהה נשאר גלוי — וכל השאר חוזרים להסתתר. כמה מהלכים תצטרכו?", buttons: [["levels", "לטרוף את החפיסה", true], ["store", "החנות"], ["help", "איך משחקים"]] });
}
function levelsView() {
  const st = P().stars, open = l => l === 1 || st[l - 1] !== undefined;
  return `${Hub.topbar("שלבים")}<div class="levels">${PAIRS.map((p, k) => { const l = k + 1;
    return `<button class="btn lvl ${st[l] !== undefined ? "done" : ""}" data-act="play" data-level="${l}" ${open(l) ? "" : "disabled"} aria-label="שלב ${l}, ${p} זוגות"><small>${p} זוגות</small><b>${l}</b><i>${!open(l) ? "🔒" : st[l] !== undefined ? "★".repeat(st[l]) + "☆".repeat(3 - st[l]) : "·"}</i></button>`; }).join("")}</div>`;
}
function gameView() {
  const cols = colsFor(G.pairs), rows = G.cards.length / cols;
  const width = `min(100%, ${cols * 110}px, calc((100svh - 260px) * ${cols / rows * .75}))`;
  return `${Hub.topbar(`שלב ${G.level}`)}
    <div class="hud"><span class="chip">⏱ <b id="timer">${Hub.fmtTime(G.secs)}</b></span><span class="chip">מהלכים <b id="moves">${G.moves}</b></span><span class="chip">זוגות <b id="found">${G.found}</b> / ${G.pairs}</span></div>
    <div class="table ${Hub.equipped("back").id}" id="table" style="grid-template-columns:repeat(${cols},1fr);width:${width};--fs:clamp(22px, ${30 / cols}vw, 46px)">
      ${G.cards.map((c, i) => `<button class="mcard" data-act="card" data-i="${i}" aria-label="קלף ${i + 1}"><div class="in"><div class="face"><span>${c.face}</span></div><div class="back"></div></div></button>`).join("")}
    </div>
    <div class="tools"><button class="btn" data-act="peek">👀 הצצה · <span id="peeks">${Hub.stock("peek")}</span></button><button class="btn" data-act="replay">חלוקה מחדש</button></div>
    <p class="status" id="status">מצאו את כל ${G.pairs} הזוגות</p>`;
}
function syncCards() {
  document.querySelectorAll(".mcard[data-i]").forEach(el => {
    const i = +el.dataset.i, c = G.cards[i];
    el.classList.toggle("up", G.up.includes(i) || G.peeking);
    el.classList.toggle("got", c.got);
    el.setAttribute("aria-label", c.got || G.up.includes(i) ? `קלף ${i + 1}: ${c.face}` : `קלף ${i + 1}, הפוך`);
  });
  $("#moves").textContent = G.moves; $("#found").textContent = G.found;
}
function helpView() {
  return `${Hub.topbar("איך משחקים")}<div class="help card">
    <h2>המטרה</h2><p>למצוא את כל זוגות הקלפים הזהים.</p>
    <h2>תור</h2><ul><li>הופכים שני קלפים. אם הם זהים — הם נשארים גלויים.</li><li>אם לא — הם חוזרים להיות הפוכים. נסו לזכור מה ראיתם ואיפה!</li></ul>
    <h2>כוכבים ומטבעות</h2><ul><li>כל שני קלפים שהופכים הם מהלך אחד. פחות מהלכים = יותר כוכבים.</li><li>שלבים גדולים נותנים יותר מטבעות. משחק חוזר נותן חצי.</li>
    <li><b>👀 הצצה</b> מראה את כל הקלפים לרגע קט. קונים עוד בחנות, יחד עם חפיסות חדשות וגבי קלפים.</li></ul>
    <p class="small" style="margin-top:14px">💡 טיפ: עברו על הלוח בסדר קבוע — שורה אחרי שורה — כך קל יותר לזכור מיקומים.</p></div>`;
}

// ---------- Playing ----------
function startTimer() { stopTimer(); timerId = setInterval(() => { G.secs++; const t = $("#timer"); if (t) t.textContent = Hub.fmtTime(G.secs); }, 1000); }
function stopTimer() { clearInterval(timerId); timerId = 0; }

function flipCard(i) {
  const c = G.cards[i];
  if (G.done || G.busy || c.got || G.up.includes(i)) return;
  if (!timerId) startTimer();
  G.up.push(i); Hub.sound("flip");
  if (G.up.length === 2) G.moves++;
  syncCards();
  if (G.up.length < 2) return;
  const [a, b] = G.up;
  if (G.cards[a].face === G.cards[b].face) {
    G.cards[a].got = G.cards[b].got = true; G.up = []; G.found++;
    setTimeout(() => Hub.sound("good"), 200); syncCards();
    if (G.found === G.pairs) finish();
  } else {
    G.busy = true;
    setTimeout(() => { document.querySelectorAll(`[data-i="${a}"],[data-i="${b}"]`).forEach(el => el.classList.add("miss")); }, 450);
    setTimeout(() => { G.up = []; G.busy = false; document.querySelectorAll(".miss").forEach(el => el.classList.remove("miss")); syncCards(); }, 950);
  }
}
function finish() {
  G.done = true; stopTimer();
  const p = P(), stars = G.moves <= Math.ceil(G.pairs * 1.6) ? 3 : G.moves <= Math.ceil(G.pairs * 2.3) ? 2 : 1;
  let coins = 8 + G.pairs * 2 + (stars - 1) * 5;
  if (p.stars[G.level] !== undefined) coins = Math.ceil(coins / 2);
  p.stars[G.level] = Math.max(p.stars[G.level] || 0, stars);
  Hub.submitScore(Object.values(p.stars).reduce((a, b) => a + b, 0), "stars");
  Hub.save(); Hub.earn(coins);
  setTimeout(() => {
    Hub.sound("win"); Hub.confetti();
    Hub.result({ title: "כל הזוגות נמצאו!", sub: `${G.moves} מהלכים · ${Hub.fmtTime(G.secs)}`, stars, coins, buttons: [G.level < PAIRS.length ? ["next", "לשלב הבא ←", true] : ["tolevels", "סיימת את כל השלבים! ✨", true], ["replay", "לשחק שוב"], ["tolevels", "לכל השלבים"]] });
  }, 700);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "back") return back();
  if (a === "levels") return go("levels");
  if (a === "store") { Hub.clearStoreMsg(); return go("store"); }
  if (a === "help") return go("help");
  if (a === "buy") { Hub.buy(b.dataset.item); return render(); }
  if (a === "play") { newGame(+b.dataset.level); return go("game"); }
  if (a === "card") return flipCard(+b.dataset.i);
  if (a === "peek") {
    if (G.done || G.busy || G.peeking) return;
    if (!Hub.useStock("peek")) { Hub.sound("wrong"); $("#status").textContent = "נגמרו ההצצות — אפשר לקנות עוד בחנות"; return; }
    G.peeking = true; G.busy = true; G.peeks++; Hub.sound("hint"); $("#peeks").textContent = Hub.stock("peek"); syncCards();
    setTimeout(() => { G.peeking = false; G.busy = false; syncCards(); }, 1300);
    return;
  }
  if (a === "next") { stopTimer(); newGame(G.level + 1); return render(); }
  if (a === "replay") { stopTimer(); newGame(G.level); return render(); }
  if (a === "tolevels") { stopTimer(); view = "levels"; nav = ["menu"]; return render(); }
});
document.addEventListener("visibilitychange", () => { if (view !== "game" || !G || G.done || !G.moves) return; document.hidden ? stopTimer() : startTimer(); });

Hub.start(CFG, (u, w) => { W = w; render(); });
</script>
</body>
</html>
