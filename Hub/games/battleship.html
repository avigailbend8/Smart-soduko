<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>צוללות · Mind Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/hub.css">
<script src="../shared/hub.js"></script>
<script src="../shared/duo.js"></script>
<style>
.sea { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; padding: 8px; border-radius: 18px; direction: ltr; background: linear-gradient(160deg, color-mix(in srgb, var(--sea) 70%, #fff), var(--sea)); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 18px 30px -18px rgba(0,0,0,.5); }
.sea.big { width: min(100%, 440px); margin: 0 auto; }
.sea.small { width: min(70%, 260px); margin: 6px auto 0; opacity: .95; }
.sea button, .sea span.c { aspect-ratio: 1; border: 0; border-radius: 6px; padding: 0; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: clamp(12px, 4vw, 22px); position: relative; }
.sea button { cursor: crosshair; }
.sea button:hover:not(.shot) { background: rgba(255,255,255,.28); }
.sea .ship { background: linear-gradient(180deg, var(--hull), color-mix(in srgb, var(--hull) 70%, #000)); }
.sea .sunk { background: color-mix(in srgb, #E0435A 55%, #000); }
.sea .boom { animation: boom .5s; }
@keyframes boom { 0% { transform: scale(1.6); filter: brightness(2); } }
.sea .dot { width: 22%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.7); }
.sea-label { text-align: center; margin: 10px 0 6px; font-weight: 500; }
.fleet { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--muted); }
.fleet s { opacity: .6; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SEAS = [
  { id: "sea-ocean", name: "אוקיינוס", price: 0, c: "#1F6F9B", hull: "#9AA8B8" },
  { id: "sea-night", name: "ים לילי", price: 100, c: "#1B2340", hull: "#7B8CC9" },
  { id: "sea-tropic", name: "לגונה", price: 110, c: "#1FA2A0", hull: "#F2C14E" },
  { id: "sea-arctic", name: "קרח", price: 130, c: "#6FA8C9", hull: "#E8F1F8" },
];
const CFG = {
  id: "battleship", title: "צוללות", startCoins: 40, startStock: { sonar: 2 },
  items: [Hub.theme("ocean", 0), Hub.theme("slate", 100), Hub.theme("indigo", 100), Hub.theme("night", 160), ...SEAS.map(x => ({ ...x, slot: "sea" })),
    { id: "sonar3", consumable: true, stockId: "sonar", amount: 3, name: "3 סונרים", desc: "חושף משבצת אחת של צוללת אויב", price: 35 }],
  storeGroups: [{ slot: "sea", title: "ים וכלי שיט" }, { slot: "theme", title: "ערכות צבע" }, { consumable: true, title: "עזרים" }],
  preview: it => it.consumable ? `<span style="font-size:38px">📡</span>` : `<div style="display:grid;grid-template-columns:repeat(4,16px);gap:2px;padding:6px;border-radius:8px;background:${it.c}">${[1, 1, 1, 0, 0, 0, 0, 0].map(v => `<i style="height:16px;border-radius:3px;background:${v ? it.hull : "rgba(255,255,255,.15)"}"></i>`).join("")}</div>`,
};
const N = 8, FLEET = [4, 3, 3, 2, 2], NAMES = { 4: "נושאת", 3: "צוללת", 2: "סירה" };
function placeFleet() { for (;;) { const f = tryFleet(); if (f) return f; } }
function tryFleet() {
  const owner = Array(N * N).fill(-1), ships = [];
  let tries = 0;
  for (const [id, len] of FLEET.entries()) {
    for (;;) {
      if (++tries > 400) return null;
      const hor = Math.random() < .5, r = Math.floor(Math.random() * (hor ? N : N - len + 1)), c = Math.floor(Math.random() * (hor ? N - len + 1 : N));
      const cells = Array.from({ length: len }, (_, k) => (r + (hor ? 0 : k)) * N + c + (hor ? k : 0));
      // ships may not touch, not even at a corner
      if (cells.some(i => { const rr = Math.floor(i / N), cc = i % N; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const R2 = rr + dr, C2 = cc + dc; if (R2 >= 0 && R2 < N && C2 >= 0 && C2 < N && owner[R2 * N + C2] >= 0) return true; } return false; })) continue;
      cells.forEach(i => { owner[i] = id; }); ships.push({ len, cells }); break;
    }
  }
  return { owner, ships, shots: Array(N * N).fill(0) }; // shots: 0 none, 1 miss, 2 hit
}
const sunk = (side, id) => side.ships[id].cells.every(i => side.shots[i] === 2);
const allSunk = side => side.ships.every((_, id) => sunk(side, id));
function fire(side, i) { if (side.shots[i]) return null; const hit = side.owner[i] >= 0; side.shots[i] = hit ? 2 : 1; return { hit, sunk: hit && sunk(side, side.owner[i]) }; }
// The computer: hunt at random (on a checkerboard on hard), then target around hits until the ship sinks
function aiTarget(G) {
  const me = G.mine, open = [...Array(N * N).keys()].filter(i => !me.shots[i]);
  if (G.d > 0) {
    const live = open.filter(i => { const r = Math.floor(i / N), c = i % N; return [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dr, dc]) => { const R2 = r + dr, C2 = c + dc; if (R2 < 0 || R2 >= N || C2 < 0 || C2 >= N) return false; const j = R2 * N + C2; return me.shots[j] === 2 && !sunk(me, me.owner[j]); }); });
    if (live.length) return live[Math.floor(Math.random() * live.length)];
    if (G.d === 2) { const par = open.filter(i => (Math.floor(i / N) + i % N) % 2 === 0); if (par.length) return par[Math.floor(Math.random() * par.length)]; }
  }
  return open[Math.floor(Math.random() * open.length)];
}

Duo.run(CFG, {
  tagline: "שני ציים מוסתרים. יורים בתורות על משבצות בים של היריב — הראשון שמטביע את כל הצי מנצח.",
  worlds: ["מפרץ שקט", "ים פתוח", "קרב הציים"],
  help: `<h2>המטרה</h2><p>להטביע את כל כלי השיט של המחשב לפני שהוא מטביע את שלכם.</p><h2>איך משחקים</h2><ul><li>לוחצים על משבצת בים העליון (של המחשב). 💥 פגיעה, ⚪ החטאה.</li><li>הצי: נושאת (4), שתי צוללות (3), שתי סירות (2). כלי שיט לא נוגעים זה בזה.</li><li>לפני היריה הראשונה אפשר לסדר מחדש את הצי שלכם.</li><li>📡 סונר חושף משבצת של צוללת אויב.</li></ul>`,
  newGame(G) { G.mine = placeFleet(); G.foe = placeFleet(); G.who = 1; G.boom = -1; G.myBoom = -1; G.started = false; },
  turn: G => G.who === 1 ? "me" : "ai",
  click(G, el) {
    const i = +el.dataset.i, r = fire(G.foe, i); if (!r) return false;
    G.started = true; G.boom = i; G.who = 2;
    G.msg = r.sunk ? `הטבעת ${NAMES[G.foe.ships[G.foe.owner[i]].len]}! 🚢` : r.hit ? "פגיעה! 💥" : "החטאה";
    Hub.sound(r.sunk ? "win" : r.hit ? "good" : "flip"); return true;
  },
  ai(G) { const i = aiTarget(G), r = fire(G.mine, i); G.myBoom = i; G.who = 1; G.msg = r.sunk ? "המחשב הטביע לך כלי שיט! 😬" : r.hit ? "המחשב פגע בך!" : "המחשב החטיא"; Hub.sound(r.hit ? "wrong" : "tap"); },
  result: G => allSunk(G.foe) ? "win" : allSunk(G.mine) ? "lose" : null,
  aiDelay: 650,
  beforeRender() { const s = Hub.equipped("sea"), st = document.documentElement.style; st.setProperty("--sea", s.c); st.setProperty("--hull", s.hull); },
  board(G) {
    const foe = G.foe, mine = G.mine;
    const foeCell = i => { const s = foe.shots[i], own = foe.owner[i], isSunk = own >= 0 && sunk(foe, own), show = G.over && own >= 0;
      return `<button data-act="cell" data-i="${i}" class="${s ? "shot" : ""} ${isSunk ? "sunk" : show ? "ship" : ""} ${i === G.boom ? "boom" : ""} ${G.sonar === i ? "ship" : ""}" aria-label="משבצת ${i + 1}">${s === 2 ? "💥" : s === 1 ? `<i class="dot"></i>` : ""}</button>`; };
    const myCell = i => { const s = mine.shots[i], own = mine.owner[i]; return `<span class="c ${own >= 0 ? (sunk(mine, own) ? "sunk" : "ship") : ""} ${i === G.myBoom ? "boom" : ""}">${s === 2 ? "💥" : s === 1 ? `<i class="dot"></i>` : ""}</span>`; };
    const fleet = side => side.ships.map((s, id) => sunk(side, id) ? `<s>${NAMES[s.len]} ${s.len}</s>` : `<span>${NAMES[s.len]} ${s.len}</span>`).join(" · ");
    return `<p class="sea-label">🎯 הים של המחשב</p><div class="sea big">${foe.shots.map((_, i) => foeCell(i)).join("")}</div><div class="fleet">${fleet(foe)}</div>
      <p class="sea-label">${Hub.user.avatar} הצי שלך</p><div class="sea small">${mine.shots.map((_, i) => myCell(i)).join("")}</div><div class="fleet">${fleet(mine)}</div>`;
  },
  tools: G => G.over ? "" : `${G.started ? "" : `<button class="btn" data-act="x-shuffle">🔀 לסדר את הצי מחדש</button>`}<button class="btn" data-act="x-sonar">📡 סונר · ${Hub.stock("sonar")}</button>`,
  act(G, a) {
    if (a === "x-shuffle" && !G.started) { G.mine = placeFleet(); Hub.sound("flip"); }
    if (a === "x-sonar" && G.who === 1 && !G.over) {
      const hidden = [...Array(N * N).keys()].filter(i => G.foe.owner[i] >= 0 && !G.foe.shots[i]);
      if (!hidden.length) return; if (!Hub.useStock("sonar")) { G.msg = "נגמרו הסונרים — יש עוד בחנות"; return; }
      G.sonar = hidden[Math.floor(Math.random() * hidden.length)]; G.msg = "📡 הסונר מצא משהו במשבצת המסומנת"; Hub.sound("hint");
    }
  },
});
</script>
</body>
</html>
