// ---------- The run ----------

function newRun(shield = false, magnet = false) {

// One row of obstacles far ahead. A train keeps its lane busy for a while.

    }
  });
  const open = free.filter(l => kinds[l] !== "block");
  if (open.length && Math.random() < .7) {
    const l = open[Math.floor(Math.random() * open.length)], k = kinds[l];
    for (let i = 0; i < 4; i++) {
      const z = FAR + (k ? i - 1.5 : i * 1.3) * 1.1;
      const h = k === "low" ? .7 + Math.sin((i + .5) / 4 * Math.PI) * 1.1 : .55;
      R.objs.push({ type: "coin", lx: l, lane: l, z, h: k === "high" ? .4 : h });
    }
  }
}
function act(m) {
  if (!R || !R.running || R.over || R.paused || R.count > 0) return;
  if (m === "left" || m === "right") { const l = Math.max(-1, Math.min(1, R.lane + (m === "left" ? -1 : 1))); if (l !== R.lane) { R.lane = l; Hub.sound("tap"); } }
  if (m === "up" && R.jt < 0) { R.jt = 0; R.slide = 0; Hub.sound("jump"); }
  if (m === "down") { R.jt = -1; R.jy = 0; R.slide = .7; Hub.sound("flip"); }
}
function update(dt) {
  if (!R.running || R.paused || R.over) return;
  if (R.count > 0) { R.count -= dt; if (R.count <= 0) Hub.sound("good"); return; }
  R.t += dt;
  R.v = Math.min(9 + R.t * .17, 23) * R.k;
  const d = R.v * dt;
  R.dist += d;
  if (R.goal && R.dist >= R.goal) return levelWin();
  R.x += (R.lane - R.x) * Math.min(1, dt * 14);
  if (R.jt >= 0) { R.jt += dt / .62; if (R.jt >= 1) { R.jt = -1; R.jy = 0; } else R.jy = 4 * 1.5 * R.jt * (1 - R.jt); }
  R.slide = Math.max(0, R.slide - dt); R.inv = Math.max(0, R.inv - dt);
  R.gap -= d;
  if (R.gap <= 0) { spawnRow(); R.gap = Math.max(7.5, 14 - R.t * .07); }
  const lane = Math.round(R.x);
  for (const o of R.objs) {
    o.z -= d;
    if (o.done) continue;
    if (o.type === "coin") {
      if (R.magnet && o.z < 7 && Math.abs(o.lane - R.lane) === 1) { o.lx += (R.x - o.lx) * Math.min(1, dt * 8); o.h += (.6 - o.h) * Math.min(1, dt * 6); }
      const near = R.magnet ? Math.abs(o.lx - R.x) < .5 : o.lane === lane;
      if (Math.abs(o.z) < .55 && near && Math.abs(o.h - (R.jy + .55)) < .85) { o.done = true; R.coins++; Hub.sound("coin"); }
      continue;
    }
    if (o.lane !== lane || o.z > .35 || o.z + o.len < -.35) continue;
    const blocked = o.type === "low" ? R.jy < .45 : o.type === "high" ? R.slide <= 0 : true;
    if (!blocked) continue;
    o.done = true;
    if (R.inv > 0) continue;
    if (R.shield) { R.shield = false; R.inv = 1.4; o.gone = true; Hub.sound("hint"); R.hits++; Hub.toast("המגן הציל אותך! 🛡"); continue; }
    return crash();
  }
  R.objs = R.objs.filter(o => o.z + (o.len || 0) > zBottom() - 1 && !(o.type === "coin" && o.done) && !o.gone);
  hud();
}
function draw(t) {
  const wd = Hub.equipped("world");
  ctx.clearRect(0, 0, V.w, V.h);
  drawWorld(ctx, wd, R.dist, t);
  // Only what is in front of the camera (z > -D would flip the projection)
  const zb = zBottom();
  const objs = R.objs.filter(o => o.z < FAR + 6 && (o.len ? o.z + o.len > zb : o.z > zb - .6) && (o.len > 1 || o.z > -D * .8)).sort((a, b) => b.z - a.z);
  for (const o of objs) if (o.z > .2) drawObj(ctx, o, t);
  drawRunner(ctx, t);
  for (const o of objs) if (o.z <= .2) drawObj(ctx, o, t);
  if (R.running && R.count > 0) {
    const n = Math.min(3, Math.ceil(R.count / .7));
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(0, 0, V.w, V.h);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `500 ${Math.round(V.w * .24)}px "Frank Ruhl Libre", serif`; ctx.fillText(n, V.w / 2, V.h * .42);
    ctx.font = `500 18px Heebo, sans-serif`; ctx.fillText("מתכוננים…", V.w / 2, V.h * .42 + V.w * .17);
  }
}
function frame(t) {
  if (view !== "game" || !R) return;
  const dt = Math.min(.05, (t - (R.time || t)) / 1000); R.time = t;
  update(dt); draw(t);
  raf = requestAnimationFrame(frame);
}
function hud() { const d = $("#hDist"), c = $("#hCoins"); if (d) { d.textContent = Math.floor(R.dist); c.textContent = R.coins; }  const g = $("#hDist"); if (g && R && R.goal) g.textContent = `${Math.min(R.goal, Math.floor(R.dist))}/${R.goal}`; }
function crash() {
  if (mode === "level") return levelFail();
  R.over = true; Hub.sound("crash");
  const st = $("#stage"); st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
  const p = P(), dist = Math.floor(R.dist), record = dist > p.best;
  p.runs++; if (record) p.best = dist;
  Hub.submitScore(dist, "best"); Hub.submitScore(R.coins, "coins");
  const coins = R.coins + Math.floor(dist / 30);
  Hub.save(); Hub.earn(coins);
  setTimeout(() => {
    if (record) Hub.confetti();
    Hub.result({ title: record ? "שיא חדש! 🏃" : "אאוץ'!", sub: `רצת <b>${dist}</b> מטר ואספת ${R.coins} מטבעות${record ? "" : ` · השיא שלך: ${p.best} מ׳`}`, coins, buttons: [["again", "עוד ריצה", true], ["tomenu", "לתפריט"]] });
  }, 800);
}
let useShield = false, useMagnet = false;
// ---------- Levels: reach a distance; later levels start faster ----------
function levelWin() {
  R.over = true; R.boost = R.brake = false;
  const stars = R.hits === 0 ? 3 : R.hits === 1 ? 2 : 1, first = Hub.levelDone(LV, stars);
  const coins = R.coins + (first ? 10 + LV * 3 : 5);
  Hub.save(); Hub.earn(coins); Hub.sound("win"); Hub.confetti();
  setTimeout(() => Hub.levelResult({ L: LV, count: COUNT, won: true, stars, coins, sub: `הגעת ל-${R.goal} מטר ואספת ${R.coins} מטבעות` }), 500);
}
function levelFail() {
  R.over = true; R.boost = R.brake = false; Hub.sound("crash");
  const st = $("#stage"); st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
  Hub.save(); if (R.coins) Hub.earn(R.coins);
  setTimeout(() => Hub.levelResult({ L: LV, count: COUNT, won: false, coins: R.coins, sub: `הגעת ל-${Math.floor(R.dist)} מתוך ${R.goal} מטר` }), 700);
}
function readyCard() {
  const s = Hub.stock("shield"), m = Hub.stock("magnet");
  useShield = s > 0; useMagnet = false;
  Hub.overlay(`<div class="ready"><h2 class="display sm">${mode === "level" ? `שלב ${LV}` : "מוכנים לרוץ?"}</h2>${mode === "level" ? `<p class="earned">🎯 ${goalOf(LV)} מטר</p>` : ""}
    <p class="lede">קפצו מעל מחסומים אדומים, החליקו מתחת לשלטים כחולים, ועקפו קרונות וארגזים.</p>
    <div class="toggles">
      <button class="toggle ${useShield ? "on" : ""}" data-act="tog" data-k="shield" ${s ? "" : "disabled"}>🛡 מגן · יש ${s}</button>
      <button class="toggle" data-act="tog" data-k="magnet" ${m ? "" : "disabled"}>🧲 מגנט · יש ${m}</button>
    </div>
    <button class="btn primary big" data-act="go">רצים! 🏃</button>
    <p class="small">←/→ נתיב · ↑ קפיצה · ↓ החלקה · רווח עצירה</p></div>`);
}

// ---------- Views ----------
function go(v) { nav.push(view); view = v; render(); scrollTo(0, 0); }
function back() { stopLoop(); view = nav.pop() || "menu"; render(); }
function stopLoop() { cancelAnimationFrame(raf); raf = 0; }
function render() {
  Hub.closeOverlay();
  $("#app").innerHTML = ({ menu: menuView, levels: () => `${Hub.topbar("שלבים")}${Hub.levelMap({ count: COUNT })}`, game: gameView, store: () => Hub.store(), help: helpView })[view]();
  if (view === "game") startStage();
}
function menuView() {
  const p = P();
  return Hub.menu({ tagline: `שלושה נתיבים ודמות שלא מפסיקה לרוץ. קפצו, החליקו והחליפו נתיב, ואספו כמה שיותר מטבעות.${p.best ? `<br><b>השיא שלך: ${p.best} מטר</b>` : ""}`, buttons: [["levels", "שלבים", true], ["play", "♾ ריצה חופשית"], ["store", "החנות"], ["help", "איך משחקים"]] });
}
function gameView() {
  return `${Hub.topbar("ריצת הנתיבים")}
    <div class="stage" id="stage"><canvas id="cv" aria-label="המסלול"></canvas>
      <div class="hud-top"><span class="chip">📏 <b id="hDist">0</b> מ׳</span><span class="chip">${Hub.coinSvg}<b id="hCoins">0</b></span><button class="icon-btn" data-act="pause" aria-label="הפסקה">⏸</button></div>
    </div>
    <div class="pad">
      <button data-pad="left" aria-label="שמאלה">◀<small>שמאלה</small></button>
      <button data-pad="up" aria-label="קפיצה">▲<small>קפיצה</small></button>
      <button data-pad="down" aria-label="החלקה">▼<small>החלקה</small></button>
      <button data-pad="right" aria-label="ימינה">▶<small>ימינה</small></button>
    </div>
    <p class="small keys">במקלדת: חצים או WASD · בטלפון: הכפתורים או החלקה על המסך לכל כיוון</p>`;
}
function helpView() {
  return `${Hub.topbar("איך משחקים")}<div class="help card">
    <h2>המטרה</h2><p>לרוץ כמה שיותר רחוק. הריצה לא נעצרת, ונהיית מהירה יותר עם הזמן.</p>
    <h2>שליטה</h2><ul><li><b>◀ ▶</b> מעבר נתיב · <b>▲</b> קפיצה · <b>▼</b> החלקה. בטלפון אפשר גם להחליק על המסך לכל כיוון.</li><li>רווח או ⏸ עוצרים את המשחק.</li></ul>
    <h2>מכשולים</h2><ul><li><b>מחסום אדום-לבן נמוך</b>: קופצים מעליו.</li><li><b>שלט כחול גבוה ▼</b>: מחליקים מתחתיו.</li><li><b>ארגזים וקרונות</b>: אי אפשר לעבור, רק לעקוף בנתיב אחר.</li></ul>
    <h2>מטבעות וחנות</h2><ul><li>מקבלים את המטבעות שאספתם ועוד מטבע על כל 30 מטר.</li><li><b>🛡 מגן</b> סופג התנגשות אחת. <b>🧲 מגנט</b> מושך מטבעות גם מהנתיבים השכנים.</li><li>בחנות יש דמויות ועולמות חדשים.</li></ul></div>`;
}
function startStage() {
  cv = $("#cv"); ctx = cv.getContext("2d");
  newRun(); measure(); hud();
  stopLoop(); raf = requestAnimationFrame(frame);
  readyCard();
}
function pause(on) {
  if (!R || !R.running || R.over) return;
  R.paused = on;
  if (on) Hub.overlay(`<h2 class="display sm">הפסקה</h2><div class="stack"><button class="btn wide primary" data-act="resume">להמשיך</button><button class="btn wide" data-act="quit">לסיים את הריצה</button></div>`);
  else Hub.closeOverlay();
}

// ---------- Input ----------
const KEYMAP = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" };
document.addEventListener("keydown", e => {
  if (view !== "game" || !R) return;
  if (e.key === " " || e.key === "Escape" || e.key === "p") { e.preventDefault(); if (!Hub.overlayOpen() || R.paused) pause(!R.paused); return; }
  const m = KEYMAP[e.key]; if (!m) return;
  e.preventDefault();
  if (!e.repeat && !Hub.overlayOpen()) act(m);
});
let swipe = null;
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-pad]");
  if (b) { e.preventDefault(); b.classList.add("held"); act(b.dataset.pad); return; }
  if (e.target.id === "cv") swipe = { x: e.clientX, y: e.clientY };
});
const release = e => {
  document.querySelectorAll(".pad .held").forEach(x => x.classList.remove("held"));
  if (swipe && e.type === "pointerup") {
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy < 0 ? "up" : "down"));
  }
  swipe = null;
};
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);
document.addEventListener("visibilitychange", () => { if (document.hidden && R && R.running && !R.over && !R.paused) pause(true); });
addEventListener("resize", () => { if (view === "game" && cv) measure(); });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "back") return back();
  if (a === "play") { mode = "free"; return go("game"); }
  if (a === "levels") return go("levels");
  if (a === "lvl") { mode = "level"; LV = +b.dataset.level; return go("game"); }
  if (a === "lvnext" || a === "lvagain") { Hub.closeOverlay(); if (a === "lvnext") LV = Math.min(COUNT, LV + 1); newRun(); hud(); readyCard(); return; }
  if (a === "lvmap") { Hub.closeOverlay(); stopLoop(); view = "levels"; nav = ["menu"]; return render(); }
  if (a === "store") { Hub.clearStoreMsg(); return go("store"); }
  if (a === "help") return go("help");
  if (a === "buy") { Hub.buy(b.dataset.item); return render(); }
  if (a === "tog") {
    if (b.dataset.k === "shield") { useShield = !useShield; b.classList.toggle("on", useShield); }
    else { useMagnet = !useMagnet; b.classList.toggle("on", useMagnet); }
    return;
  }
  if (a === "go") {
    Hub.closeOverlay();
    newRun(useShield && Hub.useStock("shield"), useMagnet && Hub.useStock("magnet"));
    R.running = true; hud(); Hub.sound("tap");
    return;
  }
  if (a === "pause") return pause(true);
  if (a === "resume") return pause(false);
  if (a === "quit") { R.paused = false; Hub.closeOverlay(); return crash(); }
  if (a === "again") { Hub.closeOverlay(); newRun(); hud(); readyCard(); return; }
  if (a === "tomenu") { stopLoop(); view = "menu"; nav = []; return render(); }
});

Hub.start(CFG, (u, w) => { W = w; render(); });
</script>
</body>
</html>
